project:
  type: book
  output-dir: .
execute:
  dir: file
  cache: false
  echo: true
  warning: false
  message: false
  fig-width: 6
  fig-height: 6
  freeze: true
format:
  custombook-html: default
  custombook-pdf: default
from: markdown+tex_math_single_backslash+tex_math_dollars
author:
  - name: "Longhai Li"
    affiliation: "University of Saskatchewan"
    url: "https://longhaisk.github.io/"
date: last-modified


book:
  repo-url: "https://github.com/longhaiSK/statmethods"
  title: "Data Analytics for Research"
  subtitle: "Statistical Inference and Learning with R"
  output-file: "stat_inference_learning"
  author:
  - name: "Longhai Li"
    affiliation: "University of Saskatchewan"
    url: "https://longhaisk.github.io/"
  date: today

  chapters:
    - index.qmd
    - unit1-introR/introR.qmd
    - unit2-slr/slr.qmd
    - unit3-mlr/mlr.qmd
    - unit3-mlr/residuals.qmd
    - unit4-lr/logistic.qmd
    - unit5-factor/crbd.qmd
    - unit6-factorial/factorial.qmd


